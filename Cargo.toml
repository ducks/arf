[package]
name = "arf-cli"
version = "20260607.0.1"
edition = "2021"
authors = ["Jake Goldsborough <github@pancakes.email>"]
description = "Agent Reasoning Format - track AI reasoning alongside git so reviewers see what the agent thought, not just what it changed."
license = "MIT"
repository = "https://github.com/ducks/arf"
homepage = "https://github.com/ducks/arf"
readme = "README.md"
keywords = ["ai", "agent", "git", "reasoning", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "arf"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
assert_cmd = "2"
assert_fs = "1"
predicates = "3"
